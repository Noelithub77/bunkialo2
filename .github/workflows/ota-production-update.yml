name: OTA Update (production)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Installed app runtime
        type: choice
        options:
          - current
          - legacy-sdk54
        default: current
        required: true
      platform:
        description: Platform to publish
        type: choice
        options: [android]
        default: android
        required: true
      update_message:
        description: Update message for the OTA release
        required: true
        default: changes
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  ota-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OTA_TARGET: ${{ inputs.target }}
      OTA_PLATFORM: android
      UPDATE_MESSAGE: ${{ inputs.update_message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Prepare compatible source
        id: source
        run: |
          if [ "$OTA_TARGET" = legacy-sdk54 ]; then
            node scripts/prepare-legacy-ota.mjs
            echo 'directory=artifacts/legacy-ota/project' >> "$GITHUB_OUTPUT"
            echo 'runtime=1.4.1' >> "$GITHUB_OUTPUT"
          else
            echo 'directory=.' >> "$GITHUB_OUTPUT"
            echo 'runtime=1.4.1-sdk58-widgets-v1' >> "$GITHUB_OUTPUT"
          fi
      - uses: expo/expo-github-action@v8
        env:
          EXPO_USE_BUN: "1"
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest
          packager: bun
      - name: Install locked dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: bun install --frozen-lockfile
      - name: Verify bundle and runtime
        working-directory: ${{ steps.source.outputs.directory }}
        env:
          EXPECTED_RUNTIME: ${{ steps.source.outputs.runtime }}
        run: |
          bun test
          bunx tsc --noEmit
          bunx expo config --type public --json > resolved-config.json
          node -e 'const c=require("./resolved-config.json"); if(c.runtimeVersion!==process.env.EXPECTED_RUNTIME || c.android.package!=="com.codialo.Bunkialo2" || c.extra.eas.projectId!=="7cbe49d9-9827-4df3-b86e-849443804d63") throw new Error("OTA runtime or app identity mismatch");'
      - name: Publish compatible production OTA
        working-directory: ${{ steps.source.outputs.directory }}
        run: eas update --branch production --platform "$OTA_PLATFORM" --message "$UPDATE_MESSAGE" --non-interactive --json > ota-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: ota-result-${{ inputs.target }}
          path: ${{ steps.source.outputs.directory }}/ota-result.json
      - name: Record target
        env:
          EXPECTED_RUNTIME: ${{ steps.source.outputs.runtime }}
        run: |
          echo "Published $OTA_TARGET ($OTA_PLATFORM), runtime $EXPECTED_RUNTIME" >> "$GITHUB_STEP_SUMMARY"
