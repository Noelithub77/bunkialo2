name: Build Android development release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional release name suffix"
        required: false
        type: string

concurrency:
  group: android-development-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Android development APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest
          packager: bun
          eas-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start remote EAS Android development build
        id: eas-build
        run: |
          set -euo pipefail
          build_json="$(eas build --platform android --profile development --wait --non-interactive --json)"
          build_id="$(node -e 'const data=JSON.parse(process.argv[1]); const build=data[0] ?? data; if(typeof build?.id !== "string") process.exit(1); process.stdout.write(build.id)' "$build_json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Download APK from EAS
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          build_json="$(eas build:view "${{ steps.eas-build.outputs.build_id }}" --json)"
          build_url="$(node -e 'const data=JSON.parse(process.argv[1]); if(typeof data?.artifacts?.buildUrl !== "string") process.exit(1); process.stdout.write(data.artifacts.buildUrl)' "$build_json")"
          curl --fail --location --retry 3 --output release-artifacts/bunkialo-android-development.apk "$build_url"

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          short_sha="${GITHUB_SHA:0:7}"
          suffix="${{ inputs.release_name }}"
          if [[ -n "$suffix" ]]; then suffix="-$suffix"; fi
          echo "tag=v${version}-android-dev${suffix}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=Bunkialo ${version} Android development${suffix} (${short_sha})" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          target_commitish: main
          generate_release_notes: true
          files: release-artifacts/bunkialo-android-development.apk
