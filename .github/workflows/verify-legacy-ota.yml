name: Verify Android OTA

on:
  workflow_dispatch:
    inputs:
      target:
        description: Installed native build
        required: true
        type: choice
        options: [legacy-sdk54, previous-sdk58, current]
        default: legacy-sdk54
      native_release_tag:
        description: Native release tag (optional for legacy and previous builds)
        required: false
        type: string
      update_id:
        description: Exact Android update ID to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OTA_TARGET: ${{ inputs.target }}
      NATIVE_RELEASE_TAG: ${{ inputs.native_release_tag }}
      EXPECTED_RUNTIME: ${{ inputs.target == 'legacy-sdk54' && '1.4.1' || inputs.target == 'previous-sdk58' && '1.4.1-sdk58-widgets-v1' || '1.5.0-sdk58-widgets-v1' }}
      EXPECTED_UPDATE_ID: ${{ inputs.update_id }}
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare matching original native app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/legacy-emulator
          bun scripts/faculty-photo-verification.ts > artifacts/legacy-emulator/expected-photo-files.json
          if [ -n "$NATIVE_RELEASE_TAG" ]; then TAG="$NATIVE_RELEASE_TAG";
          elif [ "$OTA_TARGET" = legacy-sdk54 ]; then TAG='v1.4.1(59)';
          elif [ "$OTA_TARGET" = previous-sdk58 ]; then TAG='v1.4.1(62)';
          else echo 'native_release_tag is required for v1.5 verification'; exit 1; fi
          gh release download "$TAG" --pattern app-production.aab --dir artifacts/legacy-emulator
          curl -fL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o artifacts/legacy-emulator/bundletool.jar
          keytool -genkeypair -keystore artifacts/legacy-emulator/test-only.jks -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 30
          java -jar artifacts/legacy-emulator/bundletool.jar build-apks --bundle=artifacts/legacy-emulator/app-production.aab --output=artifacts/legacy-emulator/build59.apks --mode=universal --ks=artifacts/legacy-emulator/test-only.jks --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -o artifacts/legacy-emulator/build59.apks universal.apk -d artifacts/legacy-emulator
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify production update on old native runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.target == 'legacy-sdk54' && 29 || 35 }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -no-metrics
          script: bash scripts/verify-legacy-ota.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-emulator-evidence-${{ inputs.target }}
          path: artifacts/legacy-emulator/evidence/
