name: PR Preview Update

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  publish_preview:
    name: Publish PR preview update
    type: update
    environment: development
    params:
      branch: pr-${{ github.event.pull_request.number }}
      message: "PR #${{ github.event.pull_request.number }} preview"

  comment:
    name: Comment preview on PR
    needs: [publish_preview]
    type: github-comment
    params:
      payload: |
        ## PR preview update

        **Expo Go:** [Open this update](https://qr.expo.dev/eas-update?projectId=7cbe49d9-9827-4df3-b86e-849443804d63&groupId=${{ needs.publish_preview.outputs.first_update_group_id }}&slug=exp&format=url)

        ![Expo Go QR code](https://qr.expo.dev/eas-update?projectId=7cbe49d9-9827-4df3-b86e-849443804d63&groupId=${{ needs.publish_preview.outputs.first_update_group_id }}&slug=exp&format=svg)

        The same update is also available from the EAS dashboard for the development build.
